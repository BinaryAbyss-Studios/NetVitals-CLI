name: Build Executables

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:

  # =========================
  # Windows
  # =========================
  windows:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.14"

      - name: Install dependencies
        shell: cmd
        run: |
          python -m pip install --upgrade pip
          pip install pyinstaller
          pip install scapy python-whois requests pywifi comtypes

      - name: Build
        shell: cmd
        run: |
          pyinstaller --clean --onefile --console ^
            --icon "ico\ico.ico" ^
            --add-data "src\Program.py;." ^
            --add-data "src\Systems\Tools\bruteforcer.py;." ^
            --add-data "src\Systems\Tools\Arp_spoof.py;." ^
            --add-data "src\Systems\Tools\deauth_Attack.py;." ^
            --add-data "src\Systems\Tools\Nmap_tool.py;." ^
            --add-data "src\Systems\Tools\passwordGenarator.py;." ^
            --add-data "src\Themes.py;." ^
            --collect-all scapy ^
            --collect-all whois ^
            --collect-all requests ^
            --collect-all pywifi ^
            --collect-all comtypes ^
            -u ^
            "src\main.py"

      - name: Rename executable
        shell: cmd
        run: |
          ren dist\main.exe NetVitals-Windows-x64.exe

      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: NetVitals-Windows-x64
          path: dist\NetVitals-Windows-x64.exe


  # =========================
  # Fedora / Linux
  # =========================
  fedora:
    runs-on: ubuntu-latest

    container:
      image: fedora:latest

    steps:
      - name: Install system packages
        shell: bash
        run: |
          dnf install -y \
            python3 \
            python3-pip \
            python3-devel \
            git \
            binutils \
            gcc \
            gcc-c++ \
            make

      - name: Checkout
        uses: actions/checkout@v5

      - name: Create virtual environment
        shell: bash
        run: |
          python3 -m venv .venv
          . .venv/bin/activate

      - name: Install Python dependencies
        shell: bash
        run: |
          . .venv/bin/activate
          python -m pip install --upgrade pip
          pip install pyinstaller
          pip install scapy whois requests

      - name: Build
        shell: bash
        run: |
          . .venv/bin/activate

          pyinstaller --clean --onefile --console \
            --add-data "src/Program.py:." \
            --add-data "src/Systems/Tools/bruteforcer.py:." \
            --add-data "src/Systems/Tools/Arp_spoof.py:." \
            --add-data "src/Systems/Tools/deauth_Attack.py:." \
            --add-data "src/Systems/Tools/Nmap_tool.py:." \
            --add-data "src/Systems/Tools/passwordGenarator.py:." \
            --add-data "src/Themes.py:." \
            --collect-all scapy \
            --collect-all whois \
            --collect-all requests \
            "src/main.py"

      - name: Rename executable
        shell: bash
        run: |
          mv dist/main dist/NetVitals-Linux-x64

      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: NetVitals-Linux-x64
          path: dist/NetVitals-Linux-x64


  # =========================
  # macOS Intel
  # =========================
  macos-intel:
    runs-on: macos-15-intel

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.14"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pyinstaller
          pip install scapy whois requests

      - name: Build
        run: |
          pyinstaller --clean --onefile --console \
            --add-data "src/Program.py:." \
            --add-data "src/Systems/Tools/bruteforcer.py:." \
            --add-data "src/Systems/Tools/Arp_spoof.py:." \
            --add-data "src/Systems/Tools/deauth_Attack.py:." \
            --add-data "src/Systems/Tools/Nmap_tool.py:." \
            --add-data "src/Systems/Tools/passwordGenarator.py:." \
            --add-data "src/Themes.py:." \
            --collect-all scapy \
            --collect-all whois \
            --collect-all requests \
            "src/main.py"

          mv dist/main dist/NetVitals-macOS-Intel

      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: NetVitals-macOS-Intel
          path: dist/NetVitals-macOS-Intel


  # =========================
  # macOS ARM64
  # =========================
  macos-arm64:
