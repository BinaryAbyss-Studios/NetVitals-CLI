          pip install pyinstaller
          pip install scapy whois requests

      - name: Build
        run: |
          pyinstaller --clean --onefile --console \
            --add-data "src/Program.py:." \
            --add-data "src/Systems/Tools/bruteforcer.py:." \
            --add-data "src/Systems/Tools/Arp_spoof.py:." \
            --add-data "src/Systems/Tools/deauth_Attack.py:." \
            --add-data "src/Systems/Tools/Nmap_tool.py:." \
            --add-data "src/Systems/Tools/passwordGenarator.py:." \
            --add-data "src/Themes.py:." \
            --collect-all scapy \
            --collect-all whois \
            --collect-all requests \
            "src/main.py"

          mv dist/main dist/NetVitals-macOS-ARM64

      - name: Upload
        uses: actions/upload-artifact@v4
